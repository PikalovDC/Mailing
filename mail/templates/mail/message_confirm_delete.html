{% extends 'mail/base.html' %}

{% block title %}Удаление сообщения{% endblock %}

{% block content %}
<h1>Удаление сообщения</h1>

<p>Вы уверены, что хотите удалить сообщение "{{ message.subject }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'mail:message_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
