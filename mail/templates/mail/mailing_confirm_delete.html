{% extends 'mail/base.html' %}

{% block title %}Удаление рассылки{% endblock %}

{% block content %}
<h1>Удаление рассылки</h1>

<p>Вы уверены, что хотите удалить рассылку #{{ mailing.id }} от {{ mailing.start_time|date:"d.m.Y H:i" }}?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'mail:mailing_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
