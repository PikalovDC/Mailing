<!DOCTYPE html>
<html>
<head>
    <title>Новый пароль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>Установка нового пароля</h3>
                    </div>
                    <div class="card-body">
                        {% if validlink %}
                            <form method="post">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label class="form-label">Новый пароль</label>
                                    <input type="password" name="new_password1" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Подтверждение пароля</label>
                                    <input type="password" name="new_password2" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Изменить пароль</button>
                            </form>
                        {% else %}
                            <p>Ссылка для восстановления пароля недействительна. Возможно, она уже была использована.</p>
                            <a href="{% url 'users:password_reset' %}" class="btn btn-primary w-100">Запросить новую ссылку</a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
